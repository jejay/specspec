name: Build release artifacts
# A manual run builds and uploads the artifacts. Pushing the tag vX.Y.Z of the current
# version builds them from that tag and attaches the editor packages to its GitHub
# release; PyPI publication stays with pipy_publish.yaml.
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  local-artifacts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Self-graph source anchors can reference earlier blobs; no old schema reader.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -e ".[dev]"
      - name: Read the release version
        id: version
        shell: bash
        run: printf 'version=%s\n' "$(python -c 'from tools.release import ROOT, version; print(version(ROOT))')" >> "$GITHUB_OUTPUT"
      - name: Check that the tag names this version and points to main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME does not name version $VERSION."; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "Tag $GITHUB_REF_NAME is not on main."; exit 1; }
          python tools/release.py notes "$VERSION" > /dev/null
      - run: npm ci
      - run: specspec check --sources --warnings-as-errors
      - run: specspec --root example/gantt check --sources --warnings-as-errors
      - run: python example/gantt/history/verify.py --history
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run package:all
      - uses: actions/upload-artifact@v4
        with:
          name: specspec-${{ steps.version.outputs.version }}-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.vsix
            dist/*.zip
            dist/release-manifest.json
            dist/SHA256SUMS
      # No registry, Marketplace, signing or owner-install steps.
  github-release:
    needs: local-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the editor packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.local-artifacts.outputs.version }}
        run: |
          mkdir upload
          cp "artifacts/specspec-$VERSION-Linux/specspec-vscode-$VERSION.vsix" upload/
          cp "artifacts/specspec-$VERSION-Windows/specspec-desktop-$VERSION-win32-x64.zip" upload/
          cp "artifacts/specspec-$VERSION-Linux/specspec-desktop-$VERSION-linux-x64.tar.gz" upload/
          (cd upload && sha256sum * > SHA256SUMS)
          python tools/release.py notes "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" upload/* --verify-tag \
            --title "specspec $VERSION" --notes-file notes.md

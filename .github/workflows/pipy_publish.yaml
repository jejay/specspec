name: Publish CLI to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected X.Y.Z version in all maintained package metadata
        required: true
        default: '0.0.1'
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build Python distributions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install build and verification tools
        run: python -m pip install -e ".[dev]" "twine==7.0.0"
      - name: Check exact release version
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(python -m tools.pypi_release version --expected "$EXPECTED_VERSION")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: specspec check --sources --warnings-as-errors
      - run: specspec --root example/gantt check --sources --warnings-as-errors
      - run: python example/gantt/history/verify.py --history
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --junitxml=python-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-release-tests
          path: python-tests.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Build only the CLI wheel and source distribution
        run: python -m build --outdir dist/pypi
      - name: Verify distribution membership, resources, metadata and source bytes
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python -m tools.pypi_release verify --expected "$EXPECTED_VERSION"
      - run: python -m twine check --strict dist/pypi/*
      - name: Smoke fresh wheel and source-distribution installations
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: python -m tools.pypi_release smoke --expected "$EXPECTED_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-distributions
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/pypi/*.whl
            dist/pypi/*.tar.gz

  publish:
    name: Publish verified CLI distributions
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/specspec/
    permissions:
      id-token: write
    steps:
      # No project checkout/source execution in the identity-enabled job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-distributions
          path: dist
      - name: Publish with the matching PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false

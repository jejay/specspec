name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      # Temporal fixtures are self-contained; ordinary tests need no old root schemas.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: specspec check --warnings-as-errors
      - run: specspec --root example/gantt check --warnings-as-errors
      - run: python example/gantt/history/verify.py --history
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m build
  extension:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @specspec/graph-ui-common
      - run: npm test --workspace specspec-vscode
      - run: npm run package:vscode
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Select the isolated test interpreter
        shell: bash
        run: python -c "import sys; print('SPECSPEC_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test --workspace specspec-desktop
      - name: Install pinned Electron runtime
        run: node node_modules/electron/install.js
      - name: Configure Linux sandbox helper (CI only)
        if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Real Linux desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host:electron
      - name: Real Windows desktop smoke
        if: runner.os == 'Windows'
        run: npm run test:host:electron
      - run: npm run package:electron
  gantt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone independent maintained history
        run: python example/gantt/history/checkout.py "${{ runner.temp }}/gantt"
      - run: npm --prefix "${{ runner.temp }}/gantt" test
      - name: Real local browser app
        env:
          GANTT_BROWSER: /usr/bin/google-chrome
        run: npm --prefix "${{ runner.temp }}/gantt" run test:browser

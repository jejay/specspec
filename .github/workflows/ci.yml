name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The worked example verifies its actual spec/code commit pairs.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Validate the repository specification
        run: python -m specspec validate --warnings-as-errors
      - name: Validate the independent Gantt example
        run: python -m specspec --root example/gantt validate --warnings-as-errors
      - name: Verify example CLI receipts and Git history
        run: python example/gantt/history/verify.py --history
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m build
  extension:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm --prefix ../graph-ui-common ci
      - run: npm --prefix ../graph-ui-common test
      - run: npm ci
      - run: npm test
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Select the isolated test interpreter
        shell: bash
        run: python -c "import sys; print('SPECSPEC_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - run: npm --prefix graph-ui-common ci
      - run: npm --prefix electron ci
      - run: npm --prefix electron test
      - name: Install pinned Electron runtime
        run: node electron/node_modules/electron/install.js
      - name: Configure Linux sandbox helper (CI only)
        if: runner.os == 'Linux'
        run: sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Real Linux desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm --prefix electron run test:host
      - name: Real Windows desktop smoke
        if: runner.os == 'Windows'
        run: npm --prefix electron run test:host
      - name: Build current-platform portable package
        run: npm --prefix electron run package
  gantt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dependency-free planning model
        run: npm --prefix example/gantt test
      - name: Check the real local browser app
        env:
          GANTT_BROWSER: /usr/bin/google-chrome
        run: npm --prefix example/gantt run test:browser

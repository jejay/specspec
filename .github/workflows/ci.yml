name: Checks
# Branch pushes and pull requests; a version tag points to a main commit that already
# ran these checks, and release-build.yml runs them again for the tag.
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    # Every job has a limit of a few times its usual duration; the platform's own is six hours.
    timeout-minutes: 30
    steps:
      # Source anchors refer to Git objects, so the graph checks need the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: specspec check --sources --warnings-as-errors
      - run: specspec --root example/gantt check --sources --warnings-as-errors
      - run: python example/gantt/history/verify.py --history
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -m build
  extension:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test --workspace @specspec/graph-ui-common
      - run: npm test --workspace specspec-vscode
      - run: npm run package:vscode
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - name: Select the isolated test interpreter
        shell: bash
        run: python -c "import sys; print('SPECSPEC_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test --workspace specspec-desktop
      - name: Install pinned Electron runtime
        run: node node_modules/electron/install.js
      - name: Configure Linux sandbox helper (CI only)
        if: runner.os == 'Linux'
        run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Real Linux desktop smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:host:electron
      - name: Real Windows desktop smoke
        if: runner.os == 'Windows'
        run: npm run test:host:electron
      - run: npm run package:electron
  gantt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone independent maintained history
        run: python example/gantt/history/checkout.py "${{ runner.temp }}/gantt"
      - run: npm --prefix "${{ runner.temp }}/gantt" test
      # The real-browser test fails rarely and only on runners (once on the v0.1.0 tag of
      # 702ef3c, 0 of 20 in a repeat on that commit). A second attempt decides; the first
      # attempt's output stays readable as a warning annotation.
      - name: Real local browser app
        env:
          GANTT_BROWSER: /usr/bin/google-chrome
          GANTT: ${{ runner.temp }}/gantt
        shell: bash
        run: |
          if npm --prefix "$GANTT" run test:browser > first.txt 2>&1; then cat first.txt; exit 0; fi
          cat first.txt
          python3 -c "import sys; t=open('first.txt').read()[-3500:]; print('::warning title=Gantt browser test failed once and is retried::' + t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
          npm --prefix "$GANTT" run test:browser

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "specspec"
version = "0.1.0"
description = "Tool-managed intention–conclusion specification graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["click>=8.1,<9", "ruamel.yaml>=0.18.6,<0.19"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
specspec = "specspec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
